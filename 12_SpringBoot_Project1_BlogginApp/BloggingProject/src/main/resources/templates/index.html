<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blog Posts</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">

    <!-- Page Heading -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">All Blog Posts</h2>

        <a th:href="@{/new}" class="btn btn-primary">
            + Add New Post
        </a>
    </div>

    <!-- Update or Delete by ID -->
    <div class="card shadow-sm border-0 mb-5">
        <div class="card-body p-4">

            <h4 class="fw-bold mb-3">
                Update or Delete a Post by ID
            </h4>

            <form class="row g-3 align-items-end">

                <div class="col-md-6">
                    <label for="postId" class="form-label">
                        Enter Post ID
                    </label>

                    <input type="number"
                           class="form-control"
                           id="postId"
                           name="id"
                           placeholder="Enter post ID"
                           min="1"
                           required>
                </div>

                <!-- Edit by ID -->
                <div class="col-md-3">
                    <button type="submit"
                            class="btn btn-primary w-100"
                            th:formaction="@{/edit}"
                            formmethod="get">
                        Edit Post
                    </button>
                </div>

                <!-- Delete by ID with confirmation -->
                <div class="col-md-3">
                    <button type="submit"
                            class="btn btn-danger w-100"
                            th:formaction="@{/delete}"
                            formmethod="post"
                            onclick="return confirm('Do you want to delete this post?')">
                        Delete Post
                    </button>
                </div>

            </form>
        </div>
    </div>

    <!-- Published Posts -->
    <div class="card shadow-sm border-0">
        <div class="card-body p-4">

            <h4 class="fw-bold mb-4">Published Posts</h4>

            <div class="table-responsive">
                <table class="table table-hover table-bordered align-middle">

                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Author</th>
                        <th>Content</th>
                    </tr>
                    </thead>

                    <tbody>

                    <!-- Display all posts -->
                    <tr th:each="post : ${listPosts}">
                        <td th:text="${post.id}"></td>
                        <td th:text="${post.title}"></td>
                        <td th:text="${post.author}"></td>
                        <td th:text="${post.content}"></td>
                    </tr>

                    <!-- Empty Table Message -->
                    <tr th:if="${#lists.isEmpty(listPosts)}">
                        <td colspan="5"
                            class="text-center text-muted py-4">
                            No blog posts available. Click "Add New Post" to create one.
                        </td>
                    </tr>

                    </tbody>

                </table>
            </div>

        </div>
    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
