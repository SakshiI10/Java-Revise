	<h1>Thymeleaf Tutorial</h1>

	<!-- for-each Loop -->
	<!-- <h2>List of Numbers</h2>

		<span th:text="${number}"></span>
	</h3> -->
	
	<!-- For Loop -->
	<h2>Multiplication Table</h2>
	<table border="1">
    <tr>
        <th>Expression</th>
        <th>Result</th>
    </tr>

    <tr th:each="item, indexStart : ${table}">
        <td th:text="${number + ' x ' + (indexStart.index + 1)}"></td>
        <td th:text="${item}"></td>
    </tr>
</table>
	
</html>
